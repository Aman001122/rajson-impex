<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="assets/logo/favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Rajson Impex</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
    html{
    scroll-behavior:smooth;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Inter,sans-serif;
    background:#F8F8F8;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

    color:#0A2036;

}

.card{

    background:white;

    width:90%;
    max-width:650px;

    padding:60px;

    text-align:center;

    border-radius:12px;

    box-shadow:0 20px 60px rgba(0,0,0,.08);

}

.check{

    width:90px;
    height:90px;

    margin:auto;

    border-radius:50%;

    background:#C6A15B;

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:42px;

    margin-bottom:30px;

}

h1{

    font-family:Fraunces,serif;

    font-size:42px;

    margin-bottom:20px;

}

p{

    color:#666;

    line-height:1.8;

    margin-bottom:35px;

}

.btn{

    display:inline-block;

    padding:15px 35px;

    background:#0A2036;

    color:white;

    text-decoration:none;

    border-radius:6px;

    transition:.3s;

}

.btn:hover{

    background:#12365A;

}

</style>

</head>

<body>

<div class="card">

<div class="check">✓</div>

<h1>Thank You!</h1>

<p>

Your inquiry has been received successfully.

Our team will review your request and get back to you within 24 hours.

</p>

<a href="index.html" class="btn">

Return to Home

</a>

</div>

</body>

</html>
